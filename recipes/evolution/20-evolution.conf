# Evolution API on port 8081. SERVER_URL (media links, webhooks) = fixed address + /evo,
# or the current tunnel address when there is no Worker (then it changes on restarts).
NAME=evolution
DIR=/opt/evo/app
CMD='/opt/evo/patch-manager.sh; B=${WORKER_URL:-$(cat /opt/azs/state/tunnel_url 2>/dev/null)}; SERVER_URL=${B:+$B/evo} NODE_OPTIONS=--max-old-space-size=768 exec /opt/node/bin/node dist/main'
CHECK_URL=http://127.0.0.1:8081/
GRACE=180
