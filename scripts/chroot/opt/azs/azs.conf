# Settings of the Android server (read by supervisor.sh, backup.sh and the services).
# Plain shell syntax: NAME=value, no spaces around "=".

# Router (Caddy): the only port the tunnel exposes. Each app gets a path in routes/*.caddy.
ROUTER_PORT=8080

# cloudflared metrics, where the supervisor reads the tunnel's current address.
METRICS_PORT=20260

# Fixed address (Cloudflare Worker, see references/04-internet.md). Empty = no Worker:
# the tunnel address is only written to /opt/azs/state/tunnel_url and the log.
WORKER_URL=
PUSH_KEY_FILE=/opt/azs/keys/push.key

# Backup: encryption key (only this device and the person's PC have it), token the PC
# sends to download (X-Backup-Token), how many to keep and how often (minutes).
BACKUP_KEY_FILE=/opt/azs/keys/backup.key
BACKUP_TOKEN_FILE=/opt/azs/keys/backup.token
BACKUP_KEEP=7
BACKUP_EVERY_MIN=1380
