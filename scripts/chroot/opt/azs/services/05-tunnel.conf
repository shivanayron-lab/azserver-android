# cloudflared quick tunnel: public HTTPS address (*.trycloudflare.com), no account, no open
# port. The address changes on every restart; the supervisor reads it from the metrics port
# and tells the Worker (fixed address). Healthy = connected to Cloudflare (/ready = 200).
NAME=tunnel
CMD='exec cloudflared tunnel --url "http://127.0.0.1:$ROUTER_PORT" --no-autoupdate --metrics "127.0.0.1:$METRICS_PORT"'
CHECK_CMD='curl -fs --max-time 5 "http://127.0.0.1:$METRICS_PORT/ready"'
GRACE=90
