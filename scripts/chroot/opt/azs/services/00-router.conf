# Caddy: the router. Single entry point of the tunnel (port ROUTER_PORT of azs.conf).
NAME=router
CMD='BACKUP_TOKEN=$(cat "$BACKUP_TOKEN_FILE" 2>/dev/null || echo off-$RANDOM$RANDOM) exec caddy run --config /opt/azs/Caddyfile --adapter caddyfile'
CHECK_URL="http://127.0.0.1:$ROUTER_PORT/health"
GRACE=30
